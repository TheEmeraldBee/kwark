[workspace]
resolver = "3"
members = ["flavors/*", "kwark", "kwark-buffer", "kwark-core", "kwark-input", "kwark-plugins", "kwark-render", "kwark-text", "kwark-theme", "kwark-tree-sitter", "kwark-ui", "kwark-window"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
kwark = { path = "./kwark", version = "0.0.0" }
kwark-buffer = { path = "./kwark-buffer", version = "0.0.0" }
kwark-core = { path = "./kwark-core", version = "0.0.0" }
kwark-input = { path = "./kwark-input", version = "0.0.0" }
kwark-plugins = { path = "./kwark-plugins", version = "0.0.0" }
kwark-render = { path = "./kwark-render", version = "0.0.0" }
kwark-text = { path = "./kwark-text", version = "0.0.0" }
kwark-theme = { path = "./kwark-theme", version = "0.0.0" }
kwark-tree-sitter = { path = "./kwark-tree-sitter", version = "0.0.0" }
kwark-ui = { path = "./kwark-ui", version = "0.0.0" }
kwark-window = { path = "./kwark-window", version = "0.0.0" }

# Error Handling

anyhow = "1.0.102"
thiserror = "2.0.18"

# Terminal Rendering

crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"

# Async

tokio = { version = "1.54.0", features = ["full"] }
futures-util = "0.3.32"
